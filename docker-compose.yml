version: '3.8'

services:
  server:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGOURL=mongodb://mongo:27017/assiut_robotics
      - SECRET=supersecretjwtkey_development_only
      - ALLOWED_ORIGINS=http://localhost:5500
    depends_on:
      - mongo
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
