name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Docker Image
      run: docker build -t assiut-robotics-server:latest .
      
    - name: Run Tests (if configured)
      run: npm test || echo "No tests configured yet"
      env:
        MONGOURL: mongodb://localhost:27017/assiut_robotics_test
        SECRET: testsecret
        PORT: 4000
